<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yıldız Yapı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .content {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            margin-top: 2rem;
        }
        
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏢 Yıldız Yapı</h1>
        <p>Kaliteli İnşaat ve Mimarlık Hizmetleri</p>
    </header>
    
    <div class="container">
        <div class="content">
            <h2>Hoş Geldiniz!</h2>
            <p>Yıldız Yapı web sitesi başarıyla yayınlanmıştır.</p>
            <p>Bu sayfa GitHub Pages tarafından desteklenmektedir.</p>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 Yıldız Yapı. Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
